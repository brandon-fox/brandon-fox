name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  links:
    uses: brandon-fox/.github/.github/workflows/links-check.yml@595a8111464a72b0d27e3e7391dcc713f002a73a # main
    with:
      targets: 'README.md'
